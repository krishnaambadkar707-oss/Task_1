<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Categorical Business Metrics Breakdown</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Comparison across Categories, Regions, and Customer Segments</text>

  <!-- Panel 1: Sales by Category -->
  <g transform="translate(40, 80)">
    <rect width="280" height="320" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Total Sales by Category</text>
    <line x1="40" y1="260" x2="260" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="40" y2="260" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Technology -->
    <rect x="55" y="80" width="50" height="180" fill="#1e40af" rx="4"/>
    <text x="80" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">$24,850</text>
    <text x="80" y="280" text-anchor="middle" font-size="11" fill="#475569">Technology</text>

    <!-- Furniture -->
    <rect x="125" y="115" width="50" height="145" fill="#3b82f6" rx="4"/>
    <text x="150" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b82f6">$18,420</text>
    <text x="150" y="280" text-anchor="middle" font-size="11" fill="#475569">Furniture</text>

    <!-- Office Supplies -->
    <rect x="195" y="160" width="50" height="100" fill="#93c5fd" rx="4"/>
    <text x="220" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">$12,150</text>
    <text x="220" y="280" text-anchor="middle" font-size="11" fill="#475569">Office Supp.</text>

    <text x="140" y="305" text-anchor="middle" font-size="11" fill="#64748b">Category</text>
  </g>

  <!-- Panel 2: Sales by Region -->
  <g transform="translate(360, 80)">
    <rect width="280" height="320" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Total Sales by Region</text>
    <line x1="35" y1="260" x2="265" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="35" y1="50" x2="35" y2="260" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- North -->
    <rect x="45" y="90" width="40" height="170" fill="#15803d" rx="4"/>
    <text x="65" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">$16,580</text>
    <text x="65" y="280" text-anchor="middle" font-size="11" fill="#475569">North</text>

    <!-- South -->
    <rect x="100" y="125" width="40" height="135" fill="#22c55e" rx="4"/>
    <text x="120" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">$13,240</text>
    <text x="120" y="280" text-anchor="middle" font-size="11" fill="#475569">South</text>

    <!-- East -->
    <rect x="155" y="105" width="40" height="155" fill="#16a34a" rx="4"/>
    <text x="175" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">$15,120</text>
    <text x="175" y="280" text-anchor="middle" font-size="11" fill="#475569">East</text>

    <!-- West -->
    <rect x="210" y="145" width="40" height="115" fill="#86efac" rx="4"/>
    <text x="230" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">$10,480</text>
    <text x="230" y="280" text-anchor="middle" font-size="11" fill="#475569">West</text>

    <text x="140" y="305" text-anchor="middle" font-size="11" fill="#64748b">Geographic Region</text>
  </g>

  <!-- Panel 3: Profit by Customer Segment -->
  <g transform="translate(680, 80)">
    <rect width="280" height="320" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Profit by Customer Segment</text>
    <line x1="40" y1="260" x2="260" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="40" y2="260" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Consumer -->
    <rect x="55" y="90" width="50" height="170" fill="#c2410c" rx="4"/>
    <text x="80" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">$4,820</text>
    <text x="80" y="280" text-anchor="middle" font-size="11" fill="#475569">Consumer</text>

    <!-- Corporate -->
    <rect x="125" y="120" width="50" height="140" fill="#f97316" rx="4"/>
    <text x="150" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">$3,950</text>
    <text x="150" y="280" text-anchor="middle" font-size="11" fill="#475569">Corporate</text>

    <!-- Home Office -->
    <rect x="195" y="155" width="50" height="105" fill="#fdba74" rx="4"/>
    <text x="220" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">$2,680</text>
    <text x="220" y="280" text-anchor="middle" font-size="11" fill="#475569">Home Office</text>

    <text x="140" y="305" text-anchor="middle" font-size="11" fill="#64748b">Segment</text>
  </g>
</svg>
