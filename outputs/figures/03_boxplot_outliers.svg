<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Distribution Variance &amp; Outlier Analysis (Box Plots)</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Evaluating Interquartile Ranges (IQR) and Capped Bounds Across Categories</text>

  <!-- Panel 1: Sales Distribution across Product Categories -->
  <g transform="translate(50, 85)">
    <rect width="420" height="370" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <text x="210" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Sales Distribution Across Categories</text>
    <line x1="60" y1="310" x2="380" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="60" y2="310" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Y Axis Labels -->
    <text x="50" y="315" text-anchor="end" font-size="10" fill="#64748b">$0</text>
    <text x="50" y="240" text-anchor="end" font-size="10" fill="#64748b">$750</text>
    <text x="50" y="165" text-anchor="end" font-size="10" fill="#64748b">$1,500</text>
    <text x="50" y="90" text-anchor="end" font-size="10" fill="#64748b">$2,450</text>

    <!-- Box 1: Technology -->
    <g transform="translate(100, 0)">
      <line x1="40" y1="90" x2="40" y2="280" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="25" y1="90" x2="55" y2="90" stroke="#1d4ed8" stroke-width="2"/>
      <line x1="25" y1="280" x2="55" y2="280" stroke="#1d4ed8" stroke-width="2"/>
      <rect x="15" y="140" width="50" height="90" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" opacity="0.9"/>
      <line x1="15" y1="180" x2="65" y2="180" stroke="#1e3a8a" stroke-width="3"/>
      <!-- Outliers retained/capped -->
      <circle cx="40" cy="75" r="4" fill="#ef4444"/>
      <text x="40" y="330" text-anchor="middle" font-size="11" fill="#475569">Technology</text>
    </g>

    <!-- Box 2: Furniture -->
    <g transform="translate(200, 0)">
      <line x1="40" y1="130" x2="40" y2="290" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="25" y1="130" x2="55" y2="130" stroke="#059669" stroke-width="2"/>
      <line x1="25" y1="290" x2="55" y2="290" stroke="#059669" stroke-width="2"/>
      <rect x="15" y="170" width="50" height="80" fill="#6ee7b7" stroke="#059669" stroke-width="2" opacity="0.9"/>
      <line x1="15" y1="205" x2="65" y2="205" stroke="#064e3b" stroke-width="3"/>
      <text x="40" y="330" text-anchor="middle" font-size="11" fill="#475569">Furniture</text>
    </g>

    <!-- Box 3: Office Supplies -->
    <g transform="translate(300, 0)">
      <line x1="40" y1="210" x2="40" y2="300" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="25" y1="210" x2="55" y2="210" stroke="#d97706" stroke-width="2"/>
      <line x1="25" y1="300" x2="55" y2="300" stroke="#d97706" stroke-width="2"/>
      <rect x="15" y="240" width="50" height="45" fill="#fde047" stroke="#d97706" stroke-width="2" opacity="0.9"/>
      <line x1="15" y1="260" x2="65" y2="260" stroke="#78350f" stroke-width="3"/>
      <text x="40" y="330" text-anchor="middle" font-size="11" fill="#475569">Office Supp.</text>
    </g>
  </g>

  <!-- Panel 2: Profit Variance Across Sub-Categories -->
  <g transform="translate(530, 85)">
    <rect width="420" height="370" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <text x="210" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Profit Variance Across Sub-Categories</text>
    <line x1="120" y1="320" x2="380" y2="320" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="120" y1="60" x2="120" y2="320" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Subcategory Rows -->
    <!-- Phones -->
    <text x="110" y="85" text-anchor="end" font-size="11" fill="#475569">Phones</text>
    <line x1="180" y1="80" x2="350" y2="80" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="220" y="70" width="90" height="20" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="260" y1="70" x2="260" y2="90" stroke="#4c1d95" stroke-width="2.5"/>

    <!-- Copiers -->
    <text x="110" y="130" text-anchor="end" font-size="11" fill="#475569">Copiers</text>
    <line x1="240" y1="125" x2="370" y2="125" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="280" y="115" width="70" height="20" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="320" y1="115" x2="320" y2="135" stroke="#4c1d95" stroke-width="2.5"/>

    <!-- Chairs -->
    <text x="110" y="175" text-anchor="end" font-size="11" fill="#475569">Chairs</text>
    <line x1="160" y1="170" x2="290" y2="170" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="190" y="160" width="75" height="20" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="225" y1="160" x2="225" y2="180" stroke="#4c1d95" stroke-width="2.5"/>

    <!-- Tables (Loss area) -->
    <text x="110" y="220" text-anchor="end" font-size="11" fill="#475569">Tables</text>
    <line x1="130" y1="215" x2="240" y2="215" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="140" y="205" width="70" height="20" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="175" y1="205" x2="175" y2="225" stroke="#991b1b" stroke-width="2.5"/>

    <!-- Binders -->
    <text x="110" y="265" text-anchor="end" font-size="11" fill="#475569">Binders</text>
    <line x1="140" y1="260" x2="210" y2="260" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="155" y="250" width="40" height="20" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="170" y1="250" x2="170" y2="270" stroke="#4c1d95" stroke-width="2.5"/>

    <text x="250" y="345" text-anchor="middle" font-size="11" fill="#64748b">Profit ($)</text>
  </g>
</svg>
