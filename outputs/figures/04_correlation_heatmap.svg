<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 550" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Title -->
  <text x="375" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Correlation Heatmap of Numerical Features</text>
  <text x="375" y="58" text-anchor="middle" font-size="12" fill="#64748b">Pearson Correlation Coefficients Matrix</text>

  <g transform="translate(130, 80)">
    <!-- Column Headers -->
    <text x="50" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Sales</text>
    <text x="140" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Profit</text>
    <text x="230" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Quantity</text>
    <text x="320" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Discount</text>
    <text x="410" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Ship Cost</text>
    <text x="500" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Age</text>

    <!-- Row 1: Sales -->
    <text x="-15" y="75" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">Sales</text>
    <rect x="10" y="45" width="80" height="50" fill="#b91c1c"/><text x="50" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1.00</text>
    <rect x="100" y="45" width="80" height="50" fill="#ef4444"/><text x="140" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">0.82</text>
    <rect x="190" y="45" width="80" height="50" fill="#fed7aa"/><text x="230" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">0.24</text>
    <rect x="280" y="45" width="80" height="50" fill="#e0f2fe"/><text x="320" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">-0.05</text>
    <rect x="370" y="45" width="80" height="50" fill="#fca5a5"/><text x="410" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">0.76</text>
    <rect x="460" y="45" width="80" height="50" fill="#f8fafc"/><text x="500" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.02</text>

    <!-- Row 2: Profit -->
    <text x="-15" y="135" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">Profit</text>
    <rect x="10" y="105" width="80" height="50" fill="#ef4444"/><text x="50" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">0.82</text>
    <rect x="100" y="105" width="80" height="50" fill="#b91c1c"/><text x="140" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1.00</text>
    <rect x="190" y="105" width="80" height="50" fill="#ffedd5"/><text x="230" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">0.18</text>
    <rect x="280" y="105" width="80" height="50" fill="#0284c7"/><text x="320" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-0.48</text>
    <rect x="370" y="105" width="80" height="50" fill="#fca5a5"/><text x="410" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">0.65</text>
    <rect x="460" y="105" width="80" height="50" fill="#f8fafc"/><text x="500" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.01</text>

    <!-- Row 3: Quantity -->
    <text x="-15" y="195" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">Quantity</text>
    <rect x="10" y="165" width="80" height="50" fill="#fed7aa"/><text x="50" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">0.24</text>
    <rect x="100" y="165" width="80" height="50" fill="#ffedd5"/><text x="140" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">0.18</text>
    <rect x="190" y="165" width="80" height="50" fill="#b91c1c"/><text x="230" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1.00</text>
    <rect x="280" y="165" width="80" height="50" fill="#f1f5f9"/><text x="320" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.00</text>
    <rect x="370" y="165" width="80" height="50" fill="#fed7aa"/><text x="410" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">0.22</text>
    <rect x="460" y="165" width="80" height="50" fill="#f8fafc"/><text x="500" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">-0.03</text>

    <!-- Row 4: Discount -->
    <text x="-15" y="255" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">Discount</text>
    <rect x="10" y="225" width="80" height="50" fill="#e0f2fe"/><text x="50" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">-0.05</text>
    <rect x="100" y="225" width="80" height="50" fill="#0284c7"/><text x="140" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-0.48</text>
    <rect x="190" y="225" width="80" height="50" fill="#f1f5f9"/><text x="230" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.00</text>
    <rect x="280" y="225" width="80" height="50" fill="#b91c1c"/><text x="320" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1.00</text>
    <rect x="370" y="225" width="80" height="50" fill="#f1f5f9"/><text x="410" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.01</text>
    <rect x="460" y="225" width="80" height="50" fill="#f8fafc"/><text x="500" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.00</text>

    <!-- Row 5: Shipping Cost -->
    <text x="-15" y="315" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">Ship Cost</text>
    <rect x="10" y="285" width="80" height="50" fill="#fca5a5"/><text x="50" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">0.76</text>
    <rect x="100" y="285" width="80" height="50" fill="#fca5a5"/><text x="140" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">0.65</text>
    <rect x="190" y="285" width="80" height="50" fill="#fed7aa"/><text x="230" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">0.22</text>
    <rect x="280" y="285" width="80" height="50" fill="#f1f5f9"/><text x="320" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.01</text>
    <rect x="370" y="285" width="80" height="50" fill="#b91c1c"/><text x="410" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1.00</text>
    <rect x="460" y="285" width="80" height="50" fill="#f8fafc"/><text x="500" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">0.01</text>

    <!-- Colorbar Legend -->
    <g transform="translate(10, 360)">
      <text x="0" y="20" font-size="11" font-weight="bold" fill="#475569">Negative (-1.0)</text>
      <linearGradient id="coolwarm" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0284c7"/>
        <stop offset="50%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#b91c1c"/>
      </linearGradient>
      <rect x="90" y="8" width="350" height="15" fill="url(#coolwarm)" rx="4"/>
      <text x="540" y="20" font-size="11" font-weight="bold" fill="#475569">Positive (+1.0)</text>
    </g>
  </g>
</svg>
