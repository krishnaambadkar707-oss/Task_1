<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Pairwise Relationship: Sales vs. Profit by Category</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#64748b">Multivariate Analysis (Color: Category, Size: Quantity)</text>

  <g transform="translate(70, 80)">
    <rect width="600" height="400" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <line x1="60" y1="350" x2="560" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="60" y2="350" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Y Axis Labels -->
    <text x="50" y="355" text-anchor="end" font-size="10" fill="#64748b">-$200</text>
    <text x="50" y="275" text-anchor="end" font-size="10" fill="#64748b">$0</text>
    <text x="50" y="195" text-anchor="end" font-size="10" fill="#64748b">$300</text>
    <text x="50" y="115" text-anchor="end" font-size="10" fill="#64748b">$600</text>
    <text x="50" y="45" text-anchor="end" font-size="10" fill="#64748b">$800</text>

    <!-- Zero line for Profit -->
    <line x1="60" y1="270" x2="560" y2="270" stroke="#cbd5e1" stroke-dasharray="4,4"/>

    <!-- X Axis Labels -->
    <text x="60" y="375" text-anchor="middle" font-size="10" fill="#64748b">$0</text>
    <text x="180" y="375" text-anchor="middle" font-size="10" fill="#64748b">$600</text>
    <text x="300" y="375" text-anchor="middle" font-size="10" fill="#64748b">$1,200</text>
    <text x="420" y="375" text-anchor="middle" font-size="10" fill="#64748b">$1,800</text>
    <text x="540" y="375" text-anchor="middle" font-size="10" fill="#64748b">$2,450</text>

    <!-- Scatter Points Technology (Blue) -->
    <circle cx="530" cy="110" r="9" fill="#2563eb" opacity="0.8"/>
    <circle cx="480" cy="140" r="10" fill="#2563eb" opacity="0.8"/>
    <circle cx="310" cy="190" r="8" fill="#2563eb" opacity="0.8"/>
    <circle cx="280" cy="220" r="7" fill="#2563eb" opacity="0.8"/>
    <circle cx="160" cy="240" r="6" fill="#2563eb" opacity="0.8"/>
    <circle cx="410" cy="130" r="11" fill="#2563eb" opacity="0.8"/>

    <!-- Scatter Points Furniture (Green) -->
    <circle cx="490" cy="290" r="8" fill="#16a34a" opacity="0.8"/> <!-- Table loss -->
    <circle cx="420" cy="300" r="9" fill="#16a34a" opacity="0.8"/>
    <circle cx="210" cy="230" r="7" fill="#16a34a" opacity="0.8"/>
    <circle cx="180" cy="245" r="6" fill="#16a34a" opacity="0.8"/>
    <circle cx="120" cy="255" r="5" fill="#16a34a" opacity="0.8"/>

    <!-- Scatter Points Office Supplies (Amber) -->
    <circle cx="110" cy="265" r="4" fill="#d97706" opacity="0.8"/>
    <circle cx="80" cy="268" r="5" fill="#d97706" opacity="0.8"/>
    <circle cx="140" cy="258" r="6" fill="#d97706" opacity="0.8"/>
    <circle cx="95" cy="266" r="4" fill="#d97706" opacity="0.8"/>
    <circle cx="130" cy="260" r="5" fill="#d97706" opacity="0.8"/>

    <!-- Trend line -->
    <line x1="70" y1="270" x2="540" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Axis Titles -->
    <text x="310" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Sales ($)</text>
    <text x="-20" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155" transform="rotate(-90 -20 195)">Profit ($)</text>
  </g>

  <!-- Legend Panel -->
  <g transform="translate(690, 100)">
    <rect width="180" height="350" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
    <text x="90" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Legend</text>

    <!-- Category -->
    <text x="20" y="60" font-size="11" font-weight="bold" fill="#475569">Category:</text>
    <circle cx="30" cy="85" r="6" fill="#2563eb"/><text x="45" y="89" font-size="11" fill="#334155">Technology</text>
    <circle cx="30" cy="110" r="6" fill="#16a34a"/><text x="45" y="114" font-size="11" fill="#334155">Furniture</text>
    <circle cx="30" cy="135" r="6" fill="#d97706"/><text x="45" y="139" font-size="11" fill="#334155">Office Supplies</text>

    <!-- Order Priority -->
    <text x="20" y="175" font-size="11" font-weight="bold" fill="#475569">Trend line:</text>
    <line x1="25" y1="195" x2="65" y2="195" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="75" y="199" font-size="11" fill="#334155">Linear Fit</text>

    <!-- Quantity (Size) -->
    <text x="20" y="235" font-size="11" font-weight="bold" fill="#475569">Order Quantity:</text>
    <circle cx="30" cy="260" r="4" fill="#64748b"/><text x="45" y="264" font-size="11" fill="#334155">Small (1-3)</text>
    <circle cx="30" cy="285" r="7" fill="#64748b"/><text x="45" y="289" font-size="11" fill="#334155">Medium (4-7)</text>
    <circle cx="30" cy="315" r="10" fill="#64748b"/><text x="45" y="319" font-size="11" fill="#334155">Large (8+)</text>
  </g>
</svg>
